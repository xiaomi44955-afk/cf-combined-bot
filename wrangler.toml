name = "cf-combined-bot"
main = "src/index.js"
compatibility_date = "2024-09-30"

# D1 Database
[[d1_databases]]
binding = "BOT_DB"
database_name = "cf-combined-bot-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 Bucket (optional — for file/media storage)
# [[r2_buckets]]
# binding = "BOT_STORAGE"
# bucket_name = "cf-combined-bot-storage"

# Environment variables — set via `wrangler secret put` or in dashboard
# [vars]
# BOT_TOKEN = "123456:ABC-DEF..."
# MAIN_ADMIN_ID = "123456789"
# ADMIN_IDS = "123456789,987654321"
